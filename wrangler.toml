name = "plain-bread-df6d"
main = "stock-worker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = true

# Не секрет: client_id и так виден в коде любой страницы, которая просит вход.
# Секретом остаётся только SESSION_SECRET — он ставится через wrangler secret.
[vars]
GOOGLE_CLIENT_ID = "802898443875-ipii5n1uh9u2i4n9iu87r5ks51pjk6tl.apps.googleusercontent.com"

# Счётчики лимитов ИИ: global:ДАТА и user:<id>:ДАТА
[[kv_namespaces]]
binding = "AI_LIMITS"
id = "ac103a7abff8418082c6e90fa8baea5b"

# Карточки пользователей и настройки доступа (триал, лимиты, бан) — для админ-панели.
# D1: 100 000 записей в сутки бесплатно против 1 000 у KV.
[[d1_databases]]
binding = "DB"
database_name = "investory"
database_id = "13bad18d-76dd-4210-988a-fc25bc3fd770"

# Лимиты частоты с одного IP (аудит 03.10.2026): Cache API на *.workers.dev не работает.
# Встроенный Rate Limiting бесплатен; period — только 10 или 60 секунд.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "4101"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_AI"
namespace_id = "4102"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_EXRELAY"
namespace_id = "4103"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_ME"
namespace_id = "4104"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_ADMIN"
namespace_id = "4105"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_DATA"
namespace_id = "4106"
simple = { limit = 60, period = 60 }
